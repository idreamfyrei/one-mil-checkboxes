<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Million Checkboxes</title>
    <style>
      :root {
        --bg:     #070b0f;
        --panel:  #18a66e;
        --ink:    #05160f;
        --accent: #d4e734;
        --line:   #1f2a2f;
        --text:   #d8ffec;
        --muted:  #78b89a;
      }

      * { box-sizing: border-box; }

      html {
        height: 100%; max-height: 100dvh;
        overflow: hidden; overscroll-behavior: none;
      }

      body {
        margin: 0; height: 100%; max-height: 100dvh;
        overflow: hidden; overscroll-behavior: none;
        font-family: "Inter", "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        color: var(--text);
        background:
          radial-gradient(circle at center, rgba(255,255,255,.05), transparent 55%),
          repeating-linear-gradient(0deg,  rgba(30,46,56,.4) 0, rgba(30,46,56,.4) 1px, transparent 1px, transparent 10px),
          repeating-linear-gradient(90deg, rgba(30,46,56,.4) 0, rgba(30,46,56,.4) 1px, transparent 1px, transparent 10px),
          var(--bg);
      }

      .app {
        height: 100%; max-height: 100dvh; padding: 16px;
        display: grid;
        grid-template-columns: 1fr 300px;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 14px; overflow: hidden; min-height: 0;
      }

      /* ── top bar ─────────────────────────────────────── */
      .top {
        grid-column: 1; grid-row: 1;
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 12px; flex-wrap: wrap;
      }

      .stat-card {
        width: min(380px, 100%);
        background: var(--accent); color: var(--ink);
        border: 1px solid #687306; padding: 12px;
      }
      .stat-label  { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .stat-value  { margin-top: 8px; font-size: 66px; line-height: .92; font-weight: 900; letter-spacing: 2px; }
      .meta-row    { margin-top: 10px; display: flex; justify-content: space-between; font-size: 11px; opacity: .85; }

      /* ── auth button cluster ─────────────────────────── */
      .auth-area {
        display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      }

      .auth-btn {
        border: 1px solid #2a6f57; background: #0f2f25; color: #bcf9dd;
        font-size: 13px; font-weight: 700; padding: 10px 14px; cursor: pointer;
        white-space: nowrap;
      }
      .auth-btn:hover { filter: brightness(1.15); }
      .auth-btn.logout { border-color: #6f2a2a; background: #2f0f0f; color: #f9bcbc; }

      .user-chip {
        font-size: 11px; font-weight: 700; color: var(--muted);
        letter-spacing: .05em; opacity: .9;
      }

      .readonly-badge {
        font-size: 11px; font-weight: 700; color: #f9e2bc;
        background: rgba(249,140,30,.12); border: 1px solid rgba(249,140,30,.3);
        padding: 3px 8px; letter-spacing: .04em;
      }

      /* ── board ───────────────────────────────────────── */
      .board {
        grid-column: 1; grid-row: 2; position: relative;
        border: 1px solid var(--line); background: rgba(11,15,20,.6);
        padding: 8px; min-height: 0; display: flex; flex-direction: column;
      }

      .rate-toast {
        position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
        z-index: 3; padding: 8px 14px; font-size: 12px; font-weight: 700;
        letter-spacing: .03em; color: #1a0a05;
        background: rgba(255,107,53,.96); border: 1px solid #ffc09f;
        box-shadow: 0 4px 20px rgba(0,0,0,.35);
        pointer-events: none; max-width: min(92%, 360px); text-align: center;
      }
      .rate-toast[hidden] { display: none !important; }

      .viewport {
        position: relative; flex: 1; min-height: 0; width: 100%;
        overflow-x: hidden; overflow-y: auto; touch-action: pan-y;
        overscroll-behavior: contain; background: rgba(4,8,10,.5);
        -webkit-overflow-scrolling: touch;
      }
      .spacer    { pointer-events: none; }
      .viewport canvas {
        position: absolute; inset: 0; width: 100%; height: 100%;
        display: block; cursor: crosshair;
      }
      .viewport canvas.readonly { cursor: not-allowed; }

      /* ── activity sidebar ────────────────────────────── */
      .activity {
        grid-column: 2; grid-row: 1 / span 2;
        border: 1px solid #0a6e4c; background: var(--panel); color: #093321;
        display: flex; flex-direction: column; min-height: 0;
      }
      .activity-head { border-bottom: 1px solid rgba(9,51,33,.3); padding: 12px; }
      .activity-head h2 { margin: 4px 0 0; font-size: 36px; line-height: .9; }
      .activity-sub { font-size: 11px; font-weight: 700; }

      .logs {
        flex: 1; overflow: auto; padding: 10px 12px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .log { border-bottom: 1px dashed rgba(9,51,33,.3); padding-bottom: 6px; font-size: 12px; }
      .log-user { font-weight: 700; }
      .log-time  { opacity: .8; }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto minmax(0, 1fr);
        }
        .top      { grid-column: 1; }
        .activity { grid-column: 1; grid-row: 2; max-height: 280px; }
        .board    { grid-column: 1; grid-row: 3; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <!-- ── top bar ──────────────────────────────────── -->
      <section class="top">
        <div class="stat-card">
          <div class="stat-label">TOTAL_CHECKED</div>
          <div id="totalChecked" class="stat-value">0000000</div>
          <div class="meta-row">
            <span>STATUS: ACTIVE</span>
            <span id="syncStatus">SYNC: READY</span>
          </div>
        </div>

        <div class="auth-area">
          <!-- populated by initAuthUI() -->
        </div>
      </section>

      <!-- ── canvas board ─────────────────────────────── -->
      <section class="board">
        <div id="viewport" class="viewport">
          <div id="spacer" class="spacer" aria-hidden="true"></div>
          <canvas id="canvas" aria-label="Checkbox grid"></canvas>
        </div>
        <div id="rateToast" class="rate-toast" hidden aria-live="polite"></div>
      </section>

      <!-- ── activity sidebar ─────────────────────────── -->
      <aside class="activity">
        <div class="activity-head">
          <div class="activity-sub">LIVE FEED</div>
          <h2>ACTIVITY</h2>
        </div>
        <div id="logs" class="logs"></div>
      </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // ── DOM refs ──────────────────────────────────────────────────────────
      const viewportEl    = document.getElementById('viewport');
      const spacerEl      = document.getElementById('spacer');
      const canvasEl      = document.getElementById('canvas');
      const logsEl        = document.getElementById('logs');
      const totalCheckedEl = document.getElementById('totalChecked');
      const syncStatusEl  = document.getElementById('syncStatus');
      const rateToastEl   = document.getElementById('rateToast');
      const authAreaEl    = document.querySelector('.auth-area');

      // ── State ─────────────────────────────────────────────────────────────
      const CELL = 14;
      let checkboxCount = 1_000_000;
      let gridCols = 1, gridRows = 1;
      let rateLimitMs = 5000;
      /** @type {Uint8Array|null} */ let bitCache = null;
      let drawScheduled = false;
      /** @type {{index:number;until:number}|null} */ let rateFlash = null;
      let rateToastTimer = 0;
      let lastRequestAt  = 0;
      let isLoggedIn     = false;
      let currentUser    = null;

      const ctx = canvasEl.getContext('2d', { alpha: false });

      // ── Auth UI ───────────────────────────────────────────────────────────
      function initAuthUI(user) {
        authAreaEl.innerHTML = '';
        if (user) {
          isLoggedIn  = true;
          currentUser = user;
          canvasEl.classList.remove('readonly');
          const chip = document.createElement('div');
          chip.className   = 'user-chip';
          chip.textContent = user.email.toUpperCase();
          const logoutBtn = document.createElement('button');
          logoutBtn.className   = 'auth-btn logout';
          logoutBtn.textContent = 'LOGOUT';
          logoutBtn.onclick     = () => { window.location.href = '/auth/logout'; };
          authAreaEl.appendChild(chip);
          authAreaEl.appendChild(logoutBtn);
        } else {
          isLoggedIn  = false;
          currentUser = null;
          canvasEl.classList.add('readonly');
          const badge = document.createElement('div');
          badge.className   = 'readonly-badge';
          badge.textContent = 'READ-ONLY';
          const loginBtn = document.createElement('button');
          loginBtn.className   = 'auth-btn';
          loginBtn.textContent = 'LOGIN';
          loginBtn.onclick     = () => { window.location.href = '/auth/login'; };
          authAreaEl.appendChild(badge);
          authAreaEl.appendChild(loginBtn);
        }
      }

      // Check for auth error in URL
      (function checkAuthError() {
        const params = new URLSearchParams(window.location.search);
        const err = params.get('auth_error');
        if (err) {
          rateToastEl.textContent = 'Auth error: ' + err.replace(/_/g, ' ');
          rateToastEl.hidden = false;
          rateToastTimer = window.setTimeout(() => { rateToastEl.hidden = true; }, 4000);
          window.history.replaceState({}, '', '/');
        }
      })();

      // Load current user from session
      fetch('/auth/me')
        .then(r => r.ok ? r.json() : null)
        .then(user => initAuthUI(user))
        .catch(() => initAuthUI(null));

      // ── Bitmap helpers ────────────────────────────────────────────────────
      function getBit(u8, i)    { return ((u8[i >> 3] >> (7 - (i & 7))) & 1) !== 0; }
      function setBit(u8, i, v) {
        const m = 1 << (7 - (i & 7));
        if (v) u8[i >> 3] |= m; else u8[i >> 3] &= ~m;
      }

      // ── Rendering ─────────────────────────────────────────────────────────
      function formatTotal(n) { return String(n).padStart(7, '0'); }

      function scheduleDraw() {
        if (drawScheduled) return;
        drawScheduled = true;
        requestAnimationFrame(() => {
          drawScheduled = false;
          draw();
          if (rateFlash && Date.now() < rateFlash.until) scheduleDraw();
        });
      }

      function draw() {
        if (!ctx || !bitCache) return;
        if (rateFlash && Date.now() >= rateFlash.until) rateFlash = null;

        const vw = Math.max(1, viewportEl.clientWidth || 1);
        const vh = Math.max(1, viewportEl.clientHeight || 1);
        const rawDpr = window.devicePixelRatio || 1;
        const MAX_DIM = 8192;
        const dpr = Math.min(rawDpr, MAX_DIM / vw, MAX_DIM / vh);
        canvasEl.width  = Math.max(1, Math.floor(vw * dpr));
        canvasEl.height = Math.max(1, Math.floor(vh * dpr));
        ctx.setTransform(canvasEl.width / vw, 0, 0, canvasEl.height / vh, 0, 0);

        const st = viewportEl.scrollTop;
        canvasEl.style.transform = `translateY(${st}px)`;
        const maxTop = Math.max(0, viewportEl.scrollHeight - viewportEl.clientHeight);
        if (viewportEl.scrollTop > maxTop) viewportEl.scrollTop = maxTop;
        viewportEl.scrollLeft = 0;

        const startRow  = Math.max(0, Math.floor(st / CELL));
        const endRow    = Math.min(gridRows - 1, Math.floor((st + vh - 1) / CELL));
        const startCol  = 0;
        const endCol    = Math.min(gridCols - 1, Math.floor((vw - 1) / CELL));

        ctx.fillStyle = '#0b0f14';
        ctx.fillRect(0, 0, vw, vh);

        if (startRow > endRow || startCol > endCol) return;

        for (let row = startRow; row <= endRow; row++) {
          for (let col = startCol; col <= endCol; col++) {
            const idx = row * gridCols + col;
            const x   = col * CELL;
            const y   = row * CELL - st;

            ctx.strokeStyle = '#6a8a92';
            ctx.lineWidth   = 1;
            ctx.strokeRect(x + .5, y + .5, CELL - 1, CELL - 1);

            if (idx >= checkboxCount) continue;

            if (getBit(bitCache, idx)) {
              ctx.fillStyle = '#deff50';
              ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
            }

            if (rateFlash && idx === rateFlash.index && Date.now() < rateFlash.until) {
              const t = (rateFlash.until - Date.now()) / 1800;
              ctx.save();
              ctx.strokeStyle = `rgba(255,107,53,${.4 + (1 - Math.max(0, Math.min(1, t))) * .6})`;
              ctx.lineWidth   = 3;
              ctx.strokeRect(x - 1, y - 1, CELL + 1, CELL + 1);
              ctx.restore();
            }
          }
        }
      }

      function computeGridLayout() {
        const vw = viewportEl.clientWidth || 1;
        gridCols = Math.max(1, Math.floor(vw / CELL));
        gridRows = Math.max(1, Math.ceil(checkboxCount / gridCols));
      }

      function layoutSpacer() {
        computeGridLayout();
        spacerEl.style.width  = `${gridCols * CELL}px`;
        spacerEl.style.height = `${gridRows * CELL}px`;
        requestAnimationFrame(() => scheduleDraw());
      }

      // ── Activity log ──────────────────────────────────────────────────────
      function addLog({ user, checked, index, timestamp }) {
        const el = document.createElement('div');
        el.className = 'log';
        el.innerHTML =
          `<span class="log-user">${String(user)}</span> ` +
          (checked ? 'CHECKED' : 'UNCHECKED') +
          ` #${index + 1}<br><span class="log-time">${new Date(timestamp || Date.now()).toLocaleTimeString()}</span>`;
        logsEl.prepend(el);
        while (logsEl.childElementCount > 200) logsEl.removeChild(logsEl.lastElementChild);
      }

      // ── Toast helpers ─────────────────────────────────────────────────────
      function showToast(text, durationMs = 2200) {
        rateToastEl.textContent = text;
        rateToastEl.hidden = false;
        window.clearTimeout(rateToastTimer);
        rateToastTimer = window.setTimeout(() => { rateToastEl.hidden = true; }, durationMs);
      }

      function flashCell(index) {
        rateFlash = { index, until: Date.now() + 1800 };
        scheduleDraw();
      }

      // ── Pointer → checkbox index ──────────────────────────────────────────
      function indexFromPointer(clientX, clientY) {
        const r   = viewportEl.getBoundingClientRect();
        const x   = clientX - r.left + viewportEl.scrollLeft;
        const y   = clientY - r.top  + viewportEl.scrollTop;
        const col = Math.floor(x / CELL);
        const row = Math.floor(y / CELL);
        if (col < 0 || col >= gridCols || row < 0 || row >= gridRows) return -1;
        const idx = row * gridCols + col;
        return idx >= checkboxCount ? -1 : idx;
      }

      // ── DOM events ────────────────────────────────────────────────────────
      viewportEl.addEventListener('scroll', () => {
        viewportEl.scrollLeft = 0;
        scheduleDraw();
      }, { passive: true });

      window.addEventListener('resize', layoutSpacer);

      canvasEl.addEventListener('click', (e) => {
        if (!socket || !bitCache) return;

        if (!isLoggedIn) {
          showToast('LOGIN to toggle checkboxes ↗', 3000);
          return;
        }

        const idx = indexFromPointer(e.clientX, e.clientY);
        if (idx < 0) return;

        const now = Date.now();
        if (lastRequestAt && now - lastRequestAt < rateLimitMs) {
          const waitSec = ((rateLimitMs - (now - lastRequestAt)) / 1000).toFixed(1);
          flashCell(idx);
          showToast(`WAIT — next click in ${waitSec}s`);
          return;
        }

        lastRequestAt = now;
        socket.emit('checkbox:update', { index: idx, checked: !getBit(bitCache, idx) });
      });

      // ── WebSocket ─────────────────────────────────────────────────────────
      const socket = typeof io === 'function' ? io() : null;

      if (!socket) {
        syncStatusEl.textContent = 'SYNC: OFFLINE';
      } else {
        socket.on('connect', () => {
          syncStatusEl.textContent = `SYNC: CONNECTED ${socket.id.slice(0, 6)}`;
          socket.emit('checkbox:init:request');
        });

        socket.on('disconnect', () => {
          syncStatusEl.textContent = 'SYNC: RECONNECTING';
        });

        socket.on('checkbox:init', (payload) => {
          checkboxCount = payload.checkboxCount || checkboxCount;
          rateLimitMs   = payload.rateLimitMs   || rateLimitMs;
          totalCheckedEl.textContent = formatTotal(payload.totalChecked || 0);

          // Sync auth state from socket init (server is the authority)
          if (payload.user && !isLoggedIn) {
            initAuthUI(payload.user);
          }

          bitCache = new Uint8Array(Math.ceil(checkboxCount / 8));
          layoutSpacer();
          socket.emit('checkbox:bitmap:request');
        });

        socket.on('checkbox:bitmap', (payload) => {
          if (!payload || payload.encoding !== 'base64' || !payload.data || !bitCache) return;
          const bin = atob(payload.data);
          const len = Math.min(bitCache.length, bin.length);
          for (let i = 0; i < len; i++) bitCache[i] = bin.charCodeAt(i);
          scheduleDraw();
        });

        socket.on('checkbox:updated', (event) => {
          if (!bitCache || typeof event.index !== 'number') return;
          setBit(bitCache, event.index, event.checked);
          totalCheckedEl.textContent = formatTotal(event.totalChecked);
          addLog(event);
          scheduleDraw();
        });

        socket.on('checkbox:rate_limited', (payload) => {
          const ms = payload?.retryAfterMs ?? rateLimitMs;
          lastRequestAt = Date.now() + ms - rateLimitMs;
          if (typeof payload?.index === 'number') flashCell(payload.index);
          showToast(`RATE LIMIT — try again in ${(ms / 1000).toFixed(1)}s`);
        });

        socket.on('checkbox:error', (payload) => {
          if (payload?.code === 'UNAUTHORIZED') {
            showToast('LOGIN to toggle checkboxes ↗', 3500);
            // Re-sync auth state
            fetch('/auth/me')
              .then(r => r.ok ? r.json() : null)
              .then(user => initAuthUI(user))
              .catch(() => initAuthUI(null));
          }
        });
      }
    </script>
  </body>
</html>
